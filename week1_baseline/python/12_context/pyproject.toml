[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boukensha"
version = "0.12.0"
description = "BOUKENSHA — a tiny teaching framework for coding harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Andrew Brown", email = "andrew@exampro.co"}]
dependencies = [
    "python-dotenv",
    "PyYAML",
    "requests",
    "textual",
]

[project.scripts]
boukensha = "boukensha_loader:main"

[tool.setuptools]
package-dir = {"" = "lib"}
packages = ["boukensha", "boukensha.backends", "boukensha.tools"]
py-modules = ["boukensha_loader"]
